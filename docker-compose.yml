services:
  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile.ingestor
    image: endpoint/ingestor
    env_file: .env
    environment:
      PG_HOST: db
      PG_PORT: "5432"
      DJANGO_SETTINGS_MODULE: config.settings
    working_dir: /app/src/common/db_core
    command: ["python", "manage.py", "migrate", "--no-input"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  daemon:
    build:
      context: .
      dockerfile: docker/Dockerfile.ingestor
    image: endpoint/ingestor
    env_file: .env
    environment:
      PG_HOST: db
      PG_PORT: "5432"
      ENDPOINT_DAEMON__API__HOST: "0.0.0.0"
      ENDPOINT_DAEMON__API__PORT: "8080"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ingestor_state:/var/lib/ingestor
    # Slice 14 part A: Playwright Chromium writes profile dirs and crash
    # dumps under /tmp during a Teams refresh. Mounted as a 256 MiB
    # tmpfs so a future `read_only: true` overlay (docker-compose.prod.yml)
    # doesn't break the refresh loop. 256 MiB easily covers Chromium's
    # working set; tighter caps cause the browser to fail to spawn.
    tmpfs:
      - /tmp:size=256m,mode=1777
    healthcheck:
      # Slice 14 part A: switched from a raw socket connect() to a real
      # /v1/health round-trip. The socket variant just confirmed uvicorn
      # was listening; this catches the daemon up but wedged in the
      # request path. /v1/health is the canonical slice-5 alias of
      # /api/health and never auth-gated, so probes don't need cookies.
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/v1/health', timeout=3).read()"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    stop_signal: SIGTERM
    stop_grace_period: 30s
    # Slice 14 part A: bound the daemon's resource footprint so a runaway
    # sync (large Teams payload, stuck Playwright session) can't starve
    # neighbouring services on the host. Numbers picked from observed
    # steady-state plus headroom: idle daemon sits at ~150 MiB, a busy
    # 8-worker burst peaks near 1.2 GiB. 2 GiB leaves room without
    # masking a leak. 1.5 CPU lets one Python worker plus the async
    # event loop fully utilise a core without dominating the host.
    #
    # Slice 14 part B: ``restart_policy`` under ``deploy`` bounds the
    # crash loop. ``on-failure`` retries only non-zero exits (clean
    # SIGTERM shutdowns are not retried); ``max_attempts: 5`` caps a
    # config-error or persistently-broken-dep loop so logs aren't
    # flooded by an infinite restart storm. After the 5th failure the
    # container stays stopped and slice-13's alert engine pages on
    # the missing health check.
    #
    # NOTE: ``deploy.resources.limits`` and ``deploy.restart_policy``
    # are both honoured by `docker compose up` v2 even outside swarm
    # mode; older v1 (`docker-compose`) silently ignores them. The
    # repo targets compose v2. The top-level ``restart`` key is kept
    # alongside as a fallback for any tooling that reads only the v1
    # field; compose v2 prefers ``deploy.restart_policy`` when both
    # are present.
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 2G
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
        window: 120s
    restart: unless-stopped

  # Processor worker loop. Polls ingested_items for processing_status='pending',
  # normalizes + optionally classifies (LLM), dedupes, and writes rows into
  # base_classified_items + typed children. LLM key is optional: structured
  # Moodle/Teams content skips classification entirely.
  processor:
    build:
      context: .
      dockerfile: docker/Dockerfile.processor
    image: endpoint/processor
    env_file: .env
    environment:
      PG_HOST: db
      PG_PORT: "5432"
      DJANGO_SETTINGS_MODULE: config.settings
      ENDPOINT_LLM_API_KEY: ${ENDPOINT_LLM_API_KEY:-}
      ENDPOINT_LLM_MODEL: ${ENDPOINT_LLM_MODEL:-gpt-5-nano}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # Seeds fake credentials, dead-letter rows, and Sentry events into the
  # daemon stores so the dashboard's Errors page has data to render.
  # Profile-gated because it pollutes GlitchTip with throwaway events on
  # every cold boot. Run explicitly with `--profile seeding`.
  seed:
    image: endpoint/ingestor
    profiles: [seeding]
    env_file: .env
    environment:
      PG_HOST: db
      PG_PORT: "5432"
    working_dir: /app/src/ingestion
    command: ["python", "scripts/seed_test_errors.py"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboard
    image: endpoint/dashboard
    ports:
      - "4173:80"
    depends_on:
      daemon:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Headless Teams auth server. Drives a headless Chromium session over
  # a WebSocket (JPEG frames + JSON input events) so the browser-side
  # login UI can capture Microsoft tokens without exposing them to JS.
  # The presentation-api fetches the captured payload server-to-server
  # via /internal/auth/teams/{id}/payload, gated on a shared secret.
  headless:
    build:
      context: .
      dockerfile: docker/Dockerfile.headless
    image: endpoint/headless
    environment:
      ENDPOINT_HEADLESS__INTERNAL_SECRET: ${ENDPOINT_HEADLESS__INTERNAL_SECRET:?ENDPOINT_HEADLESS__INTERNAL_SECRET must be set}
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=2)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # Django read-only API that serves the student-facing feed.
  # Reads classified rows produced by the processor from the shared
  # `db` (managed=False mirrors) and owns its own identity tables
  # (presentation_api_users / _sessions / _user_course_selections).
  # Host port is 8001 so presentation-api stays separate from headless auth
  # on 8000 and the optional GlitchTip UI on 8011.
  presentation-api:
    build:
      context: src/backend/presentation-api
      dockerfile: Dockerfile
    image: endpoint/presentation-api
    env_file: .env
    environment:
      PG_HOST: db
      PG_PORT: "5432"
      SECRET_KEY: '${PRESENTATION_API_SECRET_KEY:?PRESENTATION_API_SECRET_KEY must be set in .env (run python -c "import secrets; print(secrets.token_urlsafe(50))")}'
      DEBUG: ${PRESENTATION_API_DEBUG:-False}
      ALLOWED_HOSTS: ${PRESENTATION_API_ALLOWED_HOSTS:-localhost,127.0.0.1,presentation-api}
      CORS_ALLOWED_ORIGINS: ${PRESENTATION_API_CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      SESSION_TTL_HOURS: ${PRESENTATION_API_SESSION_TTL_HOURS:-24}
      MS_GRAPH_BASE_URL: ${PRESENTATION_API_MS_GRAPH_BASE_URL:-https://graph.microsoft.com/v1.0}
      # Hardcoded — the host-side .env value is `http://localhost:8000`
      # (correct for hybrid dev) but inside this container that resolves
      # to the presentation-api itself, not the headless service. The
      # extra_hosts mapping below covers the rare case of running the
      # headless service on the host while presentation-api is in compose.
      HEADLESS_INTERNAL_URL: http://headless:8000
      ENDPOINT_HEADLESS__INTERNAL_SECRET: ${ENDPOINT_HEADLESS__INTERNAL_SECRET:?ENDPOINT_HEADLESS__INTERNAL_SECRET must be set}
    ports:
      - "8001:8000"
    extra_hosts:
      # Lets the container reach the headless service when it runs on the
      # host (`uv run python -m ingestion.headless` during dev). Set
      # HEADLESS_INTERNAL_URL=http://host.docker.internal:8000 in that
      # mode. Defaults to the compose-internal `headless` hostname.
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  # Student-facing Next.js frontend. Server-renders the assignments,
  # announcements and dashboard pages by calling the presentation-api
  # over the compose network. The NEXT_PUBLIC_ URL points at the
  # container hostname (not localhost:8001) because the fetch happens
  # server-side inside this container.
  #
  # PRESENTATION_API_BEARER_TOKEN is per-user and expires every 24h.
  # Get a fresh one with:
  #   curl -X POST http://localhost:8001/api/v1/auth/login/ \
  #        -H "Content-Type: application/json" \
  #        -d '{"email":"frontend-demo@endpoint.dev"}'
  # then put it in .env and `docker compose up -d frontend`.
  frontend:
    build:
      context: src/EndpointNextJS/endpoint-nextjs
      dockerfile: Dockerfile
    image: endpoint/frontend
    environment:
      NEXT_PUBLIC_PRESENTATION_API_URL: http://presentation-api:8000
      PRESENTATION_API_BEARER_TOKEN: ${PRESENTATION_API_BEARER_TOKEN:-}
      # Hardcoded to the compose-internal hostname so a host-side `.env`
      # value (which has to be `http://localhost:8000` for hybrid dev)
      # doesn't bleed in: inside this container, `localhost:8000` would
      # resolve to the frontend itself, not the headless service.
      HEADLESS_PUBLIC_URL: http://headless:8000
    ports:
      - "3000:3000"
    depends_on:
      presentation-api:
        condition: service_healthy
      headless:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - "node -e \"fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # --- GlitchTip: self-hosted, Sentry-SDK-compatible error tracker. ---
  # The ingestion daemon (+ anything else with a DSN) forwards errors
  # here; the dashboard's Errors page links out for deep inspection.
  # Isolated from the endpoint Postgres so migrations can't interact.
  #
  # SLICE 14 PART C (security note): The defaults below ship with weak
  # placeholder secrets so `docker compose --profile observability up`
  # works out of the box for a single-developer dev session. Any
  # deployment that survives more than a single dev's machine MUST
  # set GLITCHTIP_SECRET_KEY and GLITCHTIP_BOOTSTRAP_ADMIN_PASSWORD
  # in `.env`; these defaults are NOT enforced via `${VAR:?required}`
  # because compose interpolates profile-gated services even when
  # their profile is inactive, which would break the daemon-only
  # `docker compose up` path. The `.gitleaks.toml` allowlists these
  # placeholders so the secret-scanning CI job doesn't false-positive
  # on the .env.example file.
  glitchtip-postgres:
    image: postgres:16-alpine
    profiles: [observability]
    environment:
      POSTGRES_USER: glitchtip
      POSTGRES_PASSWORD: glitchtip
      POSTGRES_DB: glitchtip
    volumes:
      - glitchtip_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glitchtip"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  glitchtip-redis:
    image: redis:7-alpine
    profiles: [observability]
    restart: unless-stopped

  # One-shot migration runner. Exits 0 when the schema is up to date.
  glitchtip-migrate:
    image: glitchtip/glitchtip:latest
    profiles: [observability]
    depends_on:
      glitchtip-postgres:
        condition: service_healthy
    command: ./bin/run-migrate.sh
    environment: &glitchtip-env
      DATABASE_URL: postgres://glitchtip:glitchtip@glitchtip-postgres:5432/glitchtip
      REDIS_URL: redis://glitchtip-redis:6379/0
      VALKEY_URL: redis://glitchtip-redis:6379/0
      CELERY_BROKER_URL: redis://glitchtip-redis:6379/1
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY:-change-me-in-env}
      PORT: "8080"
      EMAIL_URL: consolemail://
      GLITCHTIP_DOMAIN: ${GLITCHTIP_DOMAIN:-http://localhost:8011}
      DEFAULT_FROM_EMAIL: noreply@glitchtip.local
      CELERY_WORKER_AUTOSCALE: "1,3"
      CELERY_WORKER_MAX_TASKS_PER_CHILD: "10000"
    restart: "no"

  # Idempotent post-migrate seed. Creates a fixed admin user + org +
  # project + project key so the DSN is deterministic across every cold
  # boot (the key comes from GLITCHTIP_BOOTSTRAP_PROJECT_PUBLIC_KEY).
  # Safe to rerun; uses get_or_create throughout.
  glitchtip-bootstrap:
    image: glitchtip/glitchtip:latest
    profiles: [observability]
    depends_on:
      glitchtip-migrate:
        condition: service_completed_successfully
    volumes:
      - ./scripts/glitchtip_bootstrap.py:/code/glitchtip_bootstrap.py:ro
    command: ["python", "/code/glitchtip_bootstrap.py"]
    environment:
      <<: *glitchtip-env
      BOOTSTRAP_ADMIN_EMAIL: ${GLITCHTIP_BOOTSTRAP_ADMIN_EMAIL:-admin@endpoint.dev}
      BOOTSTRAP_ADMIN_PASSWORD: ${GLITCHTIP_BOOTSTRAP_ADMIN_PASSWORD:-endpoint-admin-dev}
      BOOTSTRAP_ORG_NAME: ${GLITCHTIP_BOOTSTRAP_ORG_NAME:-endpoint-local}
      BOOTSTRAP_ORG_SLUG: ${GLITCHTIP_BOOTSTRAP_ORG_SLUG:-endpoint-local}
      BOOTSTRAP_PROJECT_NAME: ${GLITCHTIP_BOOTSTRAP_PROJECT_NAME:-endpoint-ingestion}
      BOOTSTRAP_PROJECT_SLUG: ${GLITCHTIP_BOOTSTRAP_PROJECT_SLUG:-endpoint-ingestion}
      BOOTSTRAP_PROJECT_PUBLIC_KEY: ${GLITCHTIP_BOOTSTRAP_PROJECT_PUBLIC_KEY:-00000000-0000-4000-8000-000000000001}
      BOOTSTRAP_DOMAIN: ${GLITCHTIP_DOMAIN:-http://localhost:8011}
    restart: "no"

  # Frontend project. Chained to the ingestion bootstrap so it always lands
  # on project_id=2 — the .env.example DSN below pins to that id.
  glitchtip-bootstrap-frontend:
    image: glitchtip/glitchtip:latest
    profiles: [observability]
    depends_on:
      glitchtip-bootstrap:
        condition: service_completed_successfully
    volumes:
      - ./scripts/glitchtip_bootstrap.py:/code/glitchtip_bootstrap.py:ro
    command: ["python", "/code/glitchtip_bootstrap.py"]
    environment:
      <<: *glitchtip-env
      BOOTSTRAP_ADMIN_EMAIL: ${GLITCHTIP_BOOTSTRAP_ADMIN_EMAIL:-admin@endpoint.dev}
      BOOTSTRAP_ADMIN_PASSWORD: ${GLITCHTIP_BOOTSTRAP_ADMIN_PASSWORD:-endpoint-admin-dev}
      BOOTSTRAP_ORG_NAME: ${GLITCHTIP_BOOTSTRAP_ORG_NAME:-endpoint-local}
      BOOTSTRAP_ORG_SLUG: ${GLITCHTIP_BOOTSTRAP_ORG_SLUG:-endpoint-local}
      BOOTSTRAP_PROJECT_NAME: ${GLITCHTIP_BOOTSTRAP_FRONTEND_NAME:-endpoint-frontend}
      BOOTSTRAP_PROJECT_SLUG: ${GLITCHTIP_BOOTSTRAP_FRONTEND_SLUG:-endpoint-frontend}
      BOOTSTRAP_PROJECT_PUBLIC_KEY: ${GLITCHTIP_BOOTSTRAP_FRONTEND_PUBLIC_KEY:-00000000-0000-4000-8000-000000000002}
      BOOTSTRAP_DOMAIN: ${GLITCHTIP_DOMAIN:-http://localhost:8011}
    restart: "no"

  # Presentation-api project. Chained to the frontend bootstrap so it always
  # lands on project_id=3 — the .env.example DSN below pins to that id.
  glitchtip-bootstrap-presentation-api:
    image: glitchtip/glitchtip:latest
    profiles: [observability]
    depends_on:
      glitchtip-bootstrap-frontend:
        condition: service_completed_successfully
    volumes:
      - ./scripts/glitchtip_bootstrap.py:/code/glitchtip_bootstrap.py:ro
    command: ["python", "/code/glitchtip_bootstrap.py"]
    environment:
      <<: *glitchtip-env
      BOOTSTRAP_ADMIN_EMAIL: ${GLITCHTIP_BOOTSTRAP_ADMIN_EMAIL:-admin@endpoint.dev}
      BOOTSTRAP_ADMIN_PASSWORD: ${GLITCHTIP_BOOTSTRAP_ADMIN_PASSWORD:-endpoint-admin-dev}
      BOOTSTRAP_ORG_NAME: ${GLITCHTIP_BOOTSTRAP_ORG_NAME:-endpoint-local}
      BOOTSTRAP_ORG_SLUG: ${GLITCHTIP_BOOTSTRAP_ORG_SLUG:-endpoint-local}
      BOOTSTRAP_PROJECT_NAME: ${GLITCHTIP_BOOTSTRAP_PRESENTATION_API_NAME:-endpoint-presentation-api}
      BOOTSTRAP_PROJECT_SLUG: ${GLITCHTIP_BOOTSTRAP_PRESENTATION_API_SLUG:-endpoint-presentation-api}
      BOOTSTRAP_PROJECT_PUBLIC_KEY: ${GLITCHTIP_BOOTSTRAP_PRESENTATION_API_PUBLIC_KEY:-00000000-0000-4000-8000-000000000003}
      BOOTSTRAP_DOMAIN: ${GLITCHTIP_DOMAIN:-http://localhost:8011}
    restart: "no"

  glitchtip-web:
    image: glitchtip/glitchtip:latest
    profiles: [observability]
    ports:
      - "${GLITCHTIP_PORT:-8011}:8080"
    depends_on:
      glitchtip-bootstrap:
        condition: service_completed_successfully
      glitchtip-redis:
        condition: service_started
    environment: *glitchtip-env
    restart: unless-stopped

  glitchtip-worker:
    image: glitchtip/glitchtip:latest
    profiles: [observability]
    command: ./bin/run-celery-with-beat.sh
    depends_on:
      glitchtip-bootstrap:
        condition: service_completed_successfully
      glitchtip-redis:
        condition: service_started
    environment: *glitchtip-env
    restart: unless-stopped

  # ====================================================================
  # PostHog (self-hosted product analytics)
  # ====================================================================
  #
  # SLICE 14 PART C (security note): same dev-default policy as the
  # GlitchTip block above. The POSTHOG_* SECRET_KEY / DB password
  # defaults are weak placeholders so `docker compose --profile
  # analytics up` works out of the box on a single dev's machine.
  # Anything that outlives one dev session MUST override
  # POSTHOG_SECRET_KEY, POSTHOG_POSTGRES_PASSWORD,
  # POSTHOG_CLICKHOUSE_PASSWORD, and POSTHOG_BOOTSTRAP_ADMIN_PASSWORD
  # in `.env`. Same `${VAR:?required}` rationale: profile-gated
  # services interpolate even when the profile is inactive, so
  # hard-requiring those vars would break daemon-only compose runs.
  posthog-postgres:
    image: postgres:15-alpine
    profiles: [analytics]
    restart: on-failure
    environment:
      POSTGRES_USER: posthog
      POSTGRES_PASSWORD: ${POSTHOG_POSTGRES_PASSWORD:-posthog}
      POSTGRES_DB: posthog
    volumes:
      - posthog_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U posthog"]
      interval: 5s
      timeout: 5s
      retries: 10

  posthog-redis:
    image: redis:7-alpine
    profiles: [analytics]
    restart: on-failure
    volumes:
      - posthog_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  posthog-clickhouse:
    image: clickhouse/clickhouse-server:24.8
    profiles: [analytics]
    restart: on-failure
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    environment:
      CLICKHOUSE_USER: posthog
      CLICKHOUSE_PASSWORD: ${POSTHOG_CLICKHOUSE_PASSWORD:-posthog}
    volumes:
      - posthog_chdata:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  # KRaft-mode Kafka — no separate ZooKeeper container needed.
  # Switched from Bitnami's image (yanked from free Docker Hub) to Apache's
  # official image; env-var names differ (no KAFKA_CFG_ prefix).
  posthog-kafka:
    image: apache/kafka:3.7.0
    profiles: [analytics]
    restart: on-failure
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://posthog-kafka:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@posthog-kafka:9093"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      # Deterministic cluster id so the broker doesn't reformat storage
      # on each cold boot (the storage tool errors if id changes).
      CLUSTER_ID: "endpointposthogkraftcluster1"
    volumes:
      - posthog_kafkadata:/var/lib/kafka/data

  # PostHog migrations + setup. Runs once and exits.
  # Skip async migrations on first cold boot — PostHog's async migration
  # set has an IndexError when ClickHouse is empty; these are optimization
  # migrations the app doesn't need at the dev scale.
  posthog-migrate:
    image: posthog/posthog:latest
    profiles: [analytics]
    restart: "no"
    command: ["bash", "-c", "python manage.py migrate && python manage.py migrate_clickhouse"]
    environment: &posthog-env
      DATABASE_URL: postgres://posthog:${POSTHOG_POSTGRES_PASSWORD:-posthog}@posthog-postgres:5432/posthog
      REDIS_URL: redis://posthog-redis:6379/
      CLICKHOUSE_HOST: posthog-clickhouse
      CLICKHOUSE_DATABASE: posthog
      CLICKHOUSE_USER: posthog
      CLICKHOUSE_PASSWORD: ${POSTHOG_CLICKHOUSE_PASSWORD:-posthog}
      CLICKHOUSE_SECURE: "false"
      # Single-node ClickHouse — disable Replicated* table engines and the
      # cluster shard-replica setup the migrations otherwise try to use.
      CLICKHOUSE_REPLICATION: "false"
      KAFKA_URL: kafka://posthog-kafka:9092
      KAFKA_HOSTS: posthog-kafka:9092
      SECRET_KEY: ${POSTHOG_SECRET_KEY:-change-me-to-a-50-char-random-string}
      SITE_URL: ${POSTHOG_SITE_URL:-http://localhost:8010}
      DISABLE_SECURE_SSL_REDIRECT: "true"
      IS_BEHIND_PROXY: "false"
    depends_on:
      posthog-postgres:
        condition: service_healthy
      posthog-redis:
        condition: service_healthy
      posthog-clickhouse:
        condition: service_healthy
      posthog-kafka:
        condition: service_started

  # Idempotent bootstrap: creates a fixed admin user, org, and team
  # with a deterministic api_token so the .env-pinned NEXT_PUBLIC_POSTHOG_KEY
  # is valid out of the box. Mirrors the GlitchTip bootstrap pattern.
  posthog-bootstrap:
    image: posthog/posthog:latest
    profiles: [analytics]
    restart: "no"
    depends_on:
      posthog-migrate:
        condition: service_completed_successfully
    volumes:
      - ./scripts/posthog_bootstrap.py:/code/posthog_bootstrap.py:ro
    command: ["python", "/code/posthog_bootstrap.py"]
    environment:
      <<: *posthog-env
      BOOTSTRAP_ADMIN_EMAIL: ${POSTHOG_BOOTSTRAP_ADMIN_EMAIL:-admin@endpoint.dev}
      BOOTSTRAP_ADMIN_PASSWORD: ${POSTHOG_BOOTSTRAP_ADMIN_PASSWORD:-endpoint-admin-dev}
      BOOTSTRAP_ORG_NAME: ${POSTHOG_BOOTSTRAP_ORG_NAME:-Endpoint}
      BOOTSTRAP_PROJECT_NAME: ${POSTHOG_BOOTSTRAP_PROJECT_NAME:-endpoint-frontend}
      BOOTSTRAP_PROJECT_API_TOKEN: ${POSTHOG_BOOTSTRAP_PROJECT_API_TOKEN:-phc_endpointlocaldev0000000000000000000000}

  posthog:
    image: posthog/posthog:latest
    profiles: [analytics]
    restart: on-failure
    ports:
      - "${POSTHOG_PORT:-8010}:8000"
    environment: *posthog-env
    depends_on:
      posthog-bootstrap:
        condition: service_completed_successfully

  posthog-worker:
    image: posthog/posthog:latest
    profiles: [analytics]
    restart: on-failure
    command: ./bin/docker-worker-celery --with-scheduler
    environment: *posthog-env
    depends_on:
      posthog-bootstrap:
        condition: service_completed_successfully

volumes:
  pgdata:
  ingestor_state:
  glitchtip_pgdata:
  posthog_pgdata:
  posthog_redisdata:
  posthog_chdata:
  posthog_kafkadata:
